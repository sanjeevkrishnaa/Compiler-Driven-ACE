[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qm2026"
version = "1.0.0"
description = "Topology- and reliability-aware quantum circuit mapping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "quantum computing",
    "multi-core quantum architectures",
    "qubit mapping",
    "circuit compilation",
    "Hungarian assignment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "pyperf>=2.6,<3.0"]
tools = [
    "pytket>=1.20,<3.0",
    "qiskit>=1.0,<3.0",
    "matplotlib>=3.7,<4.0",
]

[project.scripts]
qmap = "qmap.cli:main"

[tool.setuptools.packages.find]
include = ["qmap*"]

[tool.setuptools.package-data]
qmap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_pytket: needs the pytket front-end installed",
    "requires_qiskit: needs qiskit installed",
    "slow: long-running experiment-level test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N999"]
